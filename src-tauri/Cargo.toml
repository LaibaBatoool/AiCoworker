[package]
name = "aicoworker"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "aicoworker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdf-extract = "0.12.1"
dotext = "0.1.1"
tesseract = "0.15.2"
zip = "8.6.0"
lopdf = "0.45.0"
image = "0.25.10"
docx-rs = "0.4.22"
rust_xlsxwriter = "0.79"
wait-timeout = "0.2.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
shared_child = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
