[package]
name = "aicoworker"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "aicoworker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdf-extract = "0.12.1"
dotext = "0.1.1"
tesseract = "0.15.2"
zip = "8.6.0"
lopdf = "0.45.0"
image = "0.25.10"
kamadak-exif = "0.6"
docx-rs = "0.4.22"
rust_xlsxwriter = "0.79"
calamine = "0.36"
wait-timeout = "0.2.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
shared_child = "1"

chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Dev builds (npm run tauri dev): optimise only the pure-Rust picture libraries.
# Decoding/resizing a 12 MP photo took ~20 s unoptimised. NOT "*": that also
# rebuilds leptonica-sys/tesseract-sys, whose build scripts need the MSVC
# developer environment (fails with "vcruntime.h not found").
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.moxcms]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
